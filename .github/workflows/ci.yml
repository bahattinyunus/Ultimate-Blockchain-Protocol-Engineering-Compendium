name: Protocol Engineering Compendium CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-simulators:
    name: Verify Protocol Simulators
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run All Protocol Simulators & Benchmark CLI
        run: |
          python compendium_benchmark_cli.py

  foundry-validation:
    name: Validate Smart Contracts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Verify Foundry Config & Formatter
        run: |
          forge --version
          forge fmt --check || true
